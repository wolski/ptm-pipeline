[project]
name = "ptm-pipeline"
version = "0.3.0"
description = "Deploy phosphoproteomics PTM analysis pipeline to new projects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Witold Wolski" }
]
dependencies = [
    "cyclopts>=4.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "anndata>=0.12",
    "mudata>=0.4.1",
    "h5py>=3.12",
    "numpy>=1.26",
    "pandas>=2.0",
    "kinase-library @ git+https://github.com/wolski/kinase-library",
    "proptm3d @ git+https://github.com/prolfqua/proptm3d",
    "bfabric[transfer]>=1.23,<2",
]

[project.optional-dependencies]
dev = [
    "openpyxl>=3.1",
    "pyarrow>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
docs = [
    "pymdown-extensions>=11,<12",
    "zensical==0.0.43",
]

[project.urls]
Homepage = "https://github.com/wolski/ptm-pipeline"
Repository = "https://github.com/wolski/ptm-pipeline"

[project.scripts]
ptm-pipeline = "ptm_pipeline.cli:main"
ptm-kinase = "ptm_pipeline.mudata_kinase:main"
# A tool install puts only this package's scripts on PATH; the Snakefile and
# the user (proptm3d cache MOUSE) need proptm3d's command too.
proptm3d = "proptm3d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ptm_pipeline"]

[tool.hatch.build.targets.wheel.shared-data]
"template" = "share/ptm-pipeline/template"
