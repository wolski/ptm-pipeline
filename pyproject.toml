[project]
name = "ptm-pipeline"
version = "0.3.0"
description = "Deploy phosphoproteomics PTM analysis pipeline to new projects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Witold Wolski" }
]
dependencies = [
    "cyclopts>=4.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "anndata>=0.12",
    "mudata>=0.4.1",
    "h5py>=3.12",
    "numpy>=1.26",
    "pandas>=2.0",
    "cbor2>=5.7",
    "kinase-library @ git+https://github.com/wolski/kinase-library",
]

[project.optional-dependencies]
dev = [
    "openpyxl>=3.1",
    "pyarrow>=14.0",
]

[dependency-groups]
docs = [
    "pymdown-extensions>=11,<12",
    "zensical==0.0.43",
]

[project.urls]
Homepage = "https://github.com/wolski/ptm-pipeline"
Repository = "https://github.com/wolski/ptm-pipeline"

[project.scripts]
ptm-pipeline = "ptm_pipeline.cli:main"
ptm-kinase-cbor = "ptm_pipeline.mudata_kinase:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ptm_pipeline"]

[tool.hatch.build.targets.wheel.shared-data]
"template" = "share/ptm-pipeline/template"
